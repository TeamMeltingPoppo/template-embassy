[package]
name = "xnavi"
version = "0.1.0"
edition = "2024"

publish = false

[dependencies]

embedded-hal = { version = "1.0" }
embedded-io-async = { version = "0.7.0" }
embassy-embedded-hal = { version = "0.6.0", features = ["defmt"] }

panic-probe = { version = "1.0.0", features = ["print-defmt"] }
defmt = "1.0.1"
defmt-rtt = "1.0.0"
embassy-time = { version = "0.5.1", features = ["defmt", "defmt-timestamp-uptime", "generic-queue-16"] }
rtic = { version = "2.3.1", features = ["thumbv8main-backend"]}

static_cell = "2.1"
thingbuf = { version = "0.1", default-features = false, features = ["static"] }

cortex-m = { version = "0.7.6", features = ["inline-asm", "critical-section-single-core"] }
cortex-m-rt = "0.7.0"
embassy-stm32 = { version = "0.6.0",  features = ["defmt", "unstable-pac", "time-driver-any", "stm32h503rb", "memory-x"] }

[dependencies.mavlink] # MAVLink library (wait for 0.9.0 version)
git = "https://github.com/TeamMeltingPoppo/mavlink-rs"
tag = "0.2.2"
features = ["dialect-swingby", "embedded"]
default-features = false

[profile.release]
# Enable generation of debug symbols even on release builds
debug = true

[package.metadata.embassy]
build = [
  { target = "thumbv8m.main-none-eabihf", artifact-dir = "out/stm32h503" }
]
